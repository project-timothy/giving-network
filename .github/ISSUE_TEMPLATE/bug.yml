name: Bug
description: Something behaves differently than it should
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Paste the error or the output, not a description of it.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
    validations:
      required: true
